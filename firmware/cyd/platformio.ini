; AI Agent Monitor — CYD(Cheap Yellow Display) 펌웨어
;
; Task 8: **화면 없이 시리얼만.** 툴체인 · 보드 id · 업로드 경로가 맞는지만 본다.
; WiFi · mDNS · WebSocket · monocypher · 페어링 · 재연결 · 디스플레이는 전부
; 다음 태스크에서 하나씩 붙인다. 실패했을 때 의심할 곳을 하나로 유지하기 위한
; 순서이고, 여기에 뭔가를 더할 때마다 그 성질이 깎인다.

[env:cyd]
platform = espressif32
framework = arduino

; 실물 보드는 esp32-2432S028Rv3(ST7789, USB-C + 마이크로 USB 둘 다 있는 v3)다.
; Task 8 은 그 id 가 PlatformIO 기본 보드 목록에 없어서(`pio boards | grep 2432`
; 가 아무것도 안 내놓는다) 스톡 `esp32dev` 로 미뤄 뒀다 — "보드 정의가 실제로
; 필요해지는 시점은 핀이 중요해질 때, 즉 디스플레이 태스크다"(위 커밋 이력).
; 지금이 그 시점이다(Task 14a).
;
; **보드 JSON 은 추측하지 않고 실제로 받은 저장소에서 확인했다.**
; `rzeldent/platformio-espressif32-sunton` 을 클론해 `esp32-2432S028R*.json`
; 세 파일(무터치/R/Rv2/Rv3 계열)을 대조한 결과, 우리 실물(USB-C + 마이크로
; USB 둘 다, ST7789) 과 일치하는 것은 `esp32-2432S028Rv3.json` 하나뿐이다 —
; 그 파일의 `"name"` 필드도 `"esp32-2432S028Rv3"` 로 스스로를 명명하고,
; `extra_flags` 에 `-D ESP32_2432S028Rv3`, `-D DISPLAY_ST7789_SPI`,
; `-D TOUCH_XPT2046_SPI`(저항막 터치, README 의 R = Resistive 와 일치)가
; 박혀 있어 실물 사양과 맞아떨어진다. 실측(Task 8, 위)이 확인한 flash=4MB ·
; PSRAM 없음과도 이 JSON 의 `"flash_size": "4MB"` 가 일치한다.
;
; **git submodule 대신 파일 하나를 직접 커밋했다.** README(Step 2)는 저
; 저장소를 `<project>/boards` 에 서브모듈로 두거나 `boards_dir` 로 가리키라고
; 하는데, 이 프로젝트는 어디에서도 서브모듈을 쓰지 않고(`.gitmodules` 없음)
; 우리에게 필요한 보드는 Rv3 하나뿐이라 저장소 전체(다른 40여 개 보드 JSON +
; 이미지/스키매틱 에셋)를 끌어올 이유가 없다. `boards_dir` 의 PlatformIO
; 기본값이 이미 `${PROJECT_DIR}/boards`(6.1.19, `project/options.py`
; `ConfigPlatformioOption(name="boards_dir", default=".../boards")` 로 확인)
; 라서, `boards/esp32-2432S028Rv3.json` 하나만 있으면 `boards_dir` 를 이
; 파일에 따로 안 적어도 자동으로 인식된다.
;
; **주의(라이선스):** `esp32-smartdisplay`(아래 lib_deps)의 `library.json`
; 은 `"license": "MIT"` 라고 적어 뒀지만, 그 저장소 루트의 실제 `LICENSE`
; 파일은 GPLv3 전문이다 — `platformio-espressif32-sunton`(이 보드 JSON의
; 출처) 도 `LICENSE.txt` 가 GPLv3 다. 메타데이터와 실제 라이선스 파일이
; 다르다는 것만 여기 적어 둔다(추측하지 않고 두 파일을 직접 열어 확인한
; 값). 배포 방식이 정해지면 법적 검토가 필요할 수 있다 — 이 태스크의 범위
; 밖이라 판단만 넘긴다.
board = esp32-2432S028Rv3

monitor_speed = 115200
board_build.partitions = huge_app.csv

; 포트가 둘 잡힌다(둘 다 CH340 1A86:7523 — `-2140` 이 무엇인지는 확인하지 않았다).
; 어느 쪽이 보드인지는 **쓰기 전에** 읽기 전용 esptool 로 확인했다(2026-08-27):
;   /dev/cu.usbserial-1120 → ESP32-D0WD-V3 rev v3.1, MAC 04:b2:47:9c:fa:84  ← 이쪽
;   /dev/cu.usbserial-2140 → "No serial data received" (ESP32 로 응답하지 않음)
; 자동 탐색에 맡기면 매번 어느 쪽이 걸릴지 모르므로 고정한다.
;
; **`-2140` 에 플래시하지 마라.** 같은 보드의 다른 커넥터라고 가정할 근거가 없다 —
; 같은 칩에 닿는 두 커넥터라면 양쪽 다 부트로더에 응답해야 하는데 그렇지 않다.
; 정체 불명 장치이므로 확인 없이 쓰지 않는다.
;
; macOS 의 `cu.usbserial-<번호>` 는 **USB 허브의 어느 구멍에 꽂았는지에서 파생된
; 이름**이다(프로브 당시 `LOCATION=1-1.2`). 다른 구멍이나 다른 장비로 옮기면
; `-1120` 이 없어지고 업로드가 실패한다 — 그때는 위 확인을 다시 해서 갱신한다.
upload_port = /dev/cu.usbserial-1120
monitor_port = /dev/cu.usbserial-1120

; lib_deps 는 **처음 쓰는 태스크에서만** 늘린다. Task 8 은 셋 다 쓰지 않아서
; 비워 뒀고(그래서 `No dependencies` 로 빌드됐다), Task 9 가 WiFiManager 하나를
; 더한다. LVGL 을 일부러 빼는 이유(빌드 시간과 디버깅 면적)는 그대로 유효하다 —
; ArduinoJson 과 WebSockets 는 Task 12 에서, 디스플레이 계열은 그보다 뒤에 더한다.
;
; Preferences(NVS)는 여기 없다. Arduino ESP32 코어에 딸려 오는 번들 라이브러리라
; `#include <Preferences.h>` 만으로 잡힌다 — 의존성 그래프에는 나오지만
; lib_deps 항목은 아니다.
;
; **주의: `pio pkg install --library ...` 로 여기에 항목을 더하지 마라.** 그 명령은
; 이 파일을 통째로 다시 써서 **주석을 전부 지운다**(실제로 한 번 당했고 git 에서
; 되살렸다). 손으로 적고 `pio run` 이 알아서 내려받게 두면 된다.
;
; Task 12 가 셋을 더한다: WebSocket 클라이언트(links2004/WebSockets), mDNS 는
; ESPmDNS — 이건 Preferences 와 같은 처지라 Arduino-ESP32 코어 번들이라서 여기 목록에
; 없다(#include <ESPmDNS.h> 만으로 잡힌다) — 그리고 서버 응답 JSON 을 파싱할
; ArduinoJson.
;
; Task 14a 가 esp32_smartdisplay 를 더한다 — LVGL 을 의존성으로 자동으로
; 끌어온다(`^9.2.2`, 실제로 받은 `library.json` 의 `dependencies` 로 확인 —
; Task 13 이 폰트를 구울 때 확정해 둔 버전과 정확히 같다). 버전을 `^2.1.1` 로
; 고정한 것도 같은 파일의 `"version"` 필드를 그대로 옮긴 값이다(추측 아님).
lib_deps =
    tzapu/WiFiManager@^2.0.17
    davylandman/Monocypher@2.0.6
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.1.0
    rzeldent/esp32_smartdisplay@^2.1.1
    h2zero/NimBLE-Arduino@^1.4.2

; `esp32_smartdisplay` README(Step 6)가 요구하는 빌드 플래그. `LV_CONF_PATH` 는
; **절대경로**여야 하고, `${platformio.include_dir}` 는 PlatformIO 가 빌드
; 시점에 이 프로젝트의 `include/` 절대경로로 치환해 준다 — `include/lv_conf.h`
; 를 가리킨다.
;
; **README 원문 예시를 그대로 옮기면 빌드가 깨진다 — 실제로 겪었다.**
; README Step 6 코드 블록은 `'-D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h'`
; 로 큰따옴표 없이 적어 놨는데, 그대로 쓰면 `lv_conf_internal.h` 의
; `#include LV_CONF_PATH` 가 "#include expects FILENAME or <FILENAME>" 로
; 컴파일 에러를 낸다 — 매크로가 문자열 리터럴이 아니라 경로를 그대로
; 토큰으로 치환해 `#include /abs/path/lv_conf.h` 가 되기 때문이다. 저자
; 본인의 데모 프로젝트(`rzeldent/esp32-smartdisplay-demo`, `platformio.ini:67`)
; 는 실제로는 큰따옴표를 포함해 `'-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'`
; 로 쓴다 — README 예시가 아니라 이 형태를 따랐다.
;
; **캐싱 함정(README 경고, T14a-C):** 라이브러리가 한 번 빌드되면
; `lv_conf.h` 를 고쳐도 캐시 때문에 반영되지 않을 수 있다. "빌드는 성공하는데
; 설정이 안 먹는다" 증상이 나오면 `rm -rf .pio` 로 캐시를 지우고 다시 빌드해라
; — 이 태스크에서 실제로 겪었는지는 보고서(T14a-C 절)에 적는다.
; `LV_LVGL_H_INCLUDE_SIMPLE` — `lib/font_ko/font_ko.c`(Task 13, lv_font_conv
; 생성물)와 `lib/font_ko/font_ko.h`(Task 14a) 는 둘 다 LVGL 이 자체 번들
; 폰트 파일(`lv_font_montserrat_14.c` 등)에 쓰는 표준 가드를 그대로 따른다:
; 이 매크로가 정의돼 있으면 `#include "lvgl.h"`, 아니면 `#include "lvgl/lvgl.h"`.
; 실제로 받은 `esp32_smartdisplay@2.1.1` 의 lvgl 패키지는 `lvgl.h` 가
; `.pio/libdeps/cyd/lvgl/lvgl.h` 에 있지 `.../lvgl/lvgl/lvgl.h` 가 아니라서
; 후자 경로는 "No such file or directory" 로 실패한다(실측) — 그래서
; 정의해서 전자 분기를 쓴다.
build_flags =
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=4
