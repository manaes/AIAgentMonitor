; AI Agent Monitor — CYD(Cheap Yellow Display) 펌웨어
;
; Task 8: **화면 없이 시리얼만.** 툴체인 · 보드 id · 업로드 경로가 맞는지만 본다.
; WiFi · mDNS · WebSocket · monocypher · 페어링 · 재연결 · 디스플레이는 전부
; 다음 태스크에서 하나씩 붙인다. 실패했을 때 의심할 곳을 하나로 유지하기 위한
; 순서이고, 여기에 뭔가를 더할 때마다 그 성질이 깎인다.

[env:cyd]
platform = espressif32
framework = arduino

; 실물 보드는 esp32-2432S028Rv3(ST7789, USB-C + 마이크로 USB 둘 다 있는 v3)다.
; 그런데 그 id 는 PlatformIO 기본 보드 목록에 **없다** — `pio boards | grep 2432`
; 가 아무것도 내놓지 않는다. 쓰려면 rzeldent/platformio-espressif32-sunton 포크를
; platform_packages / boards_dir 로 끌어와야 한다.
;
; 이 태스크에서는 스톡 `esp32dev` 를 쓴다. CYD 는 ESP32 classic(WROOM-32) ·
; 240MHz · 4MB flash · PSRAM 없음이고, `esp32dev` 가 정확히 그 사양이다.
;
; 실측(2026-08-27, 이 보드에 플래시해서 읽은 값):
;   flash=4194304        → 스펙 값과 정확히 일치.
;   chip=ESP32-D0WD-V3   → 브리프가 기대한 `chip=ESP32` 와 **문자열이 다르다.**
; **이건 보드 id 가 틀렸다는 뜻이 아니다.** `ESP.getChipModel()` 이 계열명이 아니라
; 부품번호를 돌려주는 것뿐이고(Arduino core 2.0.17, `cores/esp32/Esp.cpp:270-297`),
; ESP32-D0WD-V3 는 ESP32 classic 다이다 — esptool 이 독립적으로
; `Detecting chip type... ESP32` 로 같은 칩을 확인했다. cores=2 · 240MHz · WiFi/BT
; 도 전부 맞는다. **이 값을 보고 sunton 보드 정의로 갈아엎지 마라. 없는 버그다.**
;
; 반대로 서드파티 플랫폼 포크를 지금 끌어오면 "그 포크가 빌드되나 / 툴체인이
; 고정돼 있나" 가 의심 목록에 추가되는데, 이 태스크는 의심할 게 하나도 없는
; 상태를 만드는 것이 목적이다.
;
; **보드 정의가 실제로 필요해지는 시점은 핀이 중요해질 때 — 즉 디스플레이
; 태스크다.** sunton 보드 정의(또는 명시적 핀 정의)로 바꾸는 것은 거기서 한다.
board = esp32dev

monitor_speed = 115200
board_build.partitions = huge_app.csv

; 포트가 둘 잡힌다(둘 다 CH340 1A86:7523 — `-2140` 이 무엇인지는 확인하지 않았다).
; 어느 쪽이 보드인지는 **쓰기 전에** 읽기 전용 esptool 로 확인했다(2026-08-27):
;   /dev/cu.usbserial-1120 → ESP32-D0WD-V3 rev v3.1, MAC 04:b2:47:9c:fa:84  ← 이쪽
;   /dev/cu.usbserial-2140 → "No serial data received" (ESP32 로 응답하지 않음)
; 자동 탐색에 맡기면 매번 어느 쪽이 걸릴지 모르므로 고정한다.
;
; **`-2140` 에 플래시하지 마라.** 같은 보드의 다른 커넥터라고 가정할 근거가 없다 —
; 같은 칩에 닿는 두 커넥터라면 양쪽 다 부트로더에 응답해야 하는데 그렇지 않다.
; 정체 불명 장치이므로 확인 없이 쓰지 않는다.
;
; macOS 의 `cu.usbserial-<번호>` 는 **USB 허브의 어느 구멍에 꽂았는지에서 파생된
; 이름**이다(프로브 당시 `LOCATION=1-1.2`). 다른 구멍이나 다른 장비로 옮기면
; `-1120` 이 없어지고 업로드가 실패한다 — 그때는 위 확인을 다시 해서 갱신한다.
upload_port = /dev/cu.usbserial-1120
monitor_port = /dev/cu.usbserial-1120

; lib_deps 는 **처음 쓰는 태스크에서만** 늘린다. Task 8 은 셋 다 쓰지 않아서
; 비워 뒀고(그래서 `No dependencies` 로 빌드됐다), Task 9 가 WiFiManager 하나를
; 더한다. LVGL 을 일부러 빼는 이유(빌드 시간과 디버깅 면적)는 그대로 유효하다 —
; ArduinoJson 과 WebSockets 는 Task 12 에서, 디스플레이 계열은 그보다 뒤에 더한다.
;
; Preferences(NVS)는 여기 없다. Arduino ESP32 코어에 딸려 오는 번들 라이브러리라
; `#include <Preferences.h>` 만으로 잡힌다 — 의존성 그래프에는 나오지만
; lib_deps 항목은 아니다.
;
; **주의: `pio pkg install --library ...` 로 여기에 항목을 더하지 마라.** 그 명령은
; 이 파일을 통째로 다시 써서 **주석을 전부 지운다**(실제로 한 번 당했고 git 에서
; 되살렸다). 손으로 적고 `pio run` 이 알아서 내려받게 두면 된다.
lib_deps =
    tzapu/WiFiManager@^2.0.17
    davylandman/Monocypher@2.0.6
