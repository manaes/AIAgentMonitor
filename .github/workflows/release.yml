name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Agent Monitor ${{ github.ref_name }}'
          releaseBody: |
            ## AI Agent Monitor ${{ github.ref_name }}

            Claude Code와 Codex의 토큰 사용량을 상태 바에서 실시간 모니터링합니다.

            ### 설치
            | 플랫폼 | 파일 |
            |---|---|
            | macOS Apple Silicon | `*_aarch64.dmg` |
            | macOS Intel | `*_x64.dmg` |
            | Windows | `*_x64_en-US.msi` |

            **macOS 첫 실행 시** Gatekeeper 경고가 뜨면:
            ```bash
            xattr -cr "/Applications/AI Agent Monitor.app"
            ```
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
