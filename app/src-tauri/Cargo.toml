[package]
name = "ai-agent-monitor"
version = "1.7.4"
description = "AI Agent Monitor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_agent_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "7"
notify-debouncer-full = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
dirs-next = "2"
axum = { version = "0.7", features = ["json", "ws"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tauri-plugin-updater = "2"
hmac = "0.13.0"
sha2 = "0.11.0"
iroh = "1.0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
hyper = { version = "1", features = ["server", "http1"] }
mdns-sd = "0.21.0"
# mDNS 레코드에 넣을 호스트 이름. `scutil --get LocalHostName` 은 맥에만 있고
# 이 앱은 윈도우 MSI 도 낸다 — 이 크레이트는 non-Windows 에서
# `rustix::system::uname().nodename()`(= `uname(2)`), 윈도우에서
# `GetComputerNameExW` 를 부르는 얇은 래퍼라 서브프로세스가 없다. 끌어오는
# `rustix`("system")·`windows-link` 은 둘 다 이미 lock 에 있어 새로 받는 패키지는
# 없다.
gethostname = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSObject", "NSError", "NSValue", "NSUUID"] }
objc2-core-bluetooth = { version = "0.3", features = ["CBPeripheralManager", "CBPeripheralManagerConstants", "CBAdvertisementData", "CBCentral", "CBService", "CBCharacteristic", "CBDescriptor", "CBUUID", "CBAttribute", "CBATTRequest", "CBError", "CBManager", "CBPeer", "CBDefines"] }

[dev-dependencies]
tempfile = "3"

# iroh → netwatch(Windows 네트워크 변경 감지) → wmi 가 windows/windows-core 를
# 넓은 범위(>=0.59,<0.63)로 열어둬서, tauri/wry 계열(^0.61)과 netwatch 자체(0.62.2)가
# 그래프에 함께 있을 때 Cargo 가 wmi 의 두 엣지(windows/windows-core)를 서로 다른
# 메이저 라인으로 따로 배정해버린다 — wmi 컴파일 자체가
# "IWbemObjectSink(0.61) 가 Interface(0.62) 를 구현 안 함" 으로 깨진다(Windows CI 확인).
# 벤더링한 wmi 에서 windows/windows-core 를 =0.61.3/=0.61.2 로 고정해 이미 그래프에
# 있는 자기일관적인 짝을 강제한다. 자세한 내용은 vendor/README.md 참고.
[patch.crates-io]
wmi = { path = "vendor/wmi-0.18.4" }
